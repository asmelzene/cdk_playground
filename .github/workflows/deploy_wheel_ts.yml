name: Deploy Glue Job

on:
  push:
    branches:
      - 'wheel*'

jobs:
  deploy-wheel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'  # Upgrade to a supported version of Node.js

      - name: Install AWS CDK globally
        run: npm install -g aws-cdk

      - name: Install dependencies
        working-directory: ./ts-glue-cdk-example  # Set the correct working directory 
        run: npm install

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Build Python package
        run: |
          python3 -m pip install --upgrade pip
          pip install setuptools wheel
          python3 setup_wheel.py bdist_wheel

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Synthesize CDK
        working-directory: ./ts-glue-cdk-example # Navigate to the Python package directory
        run: cdk synth

      - name: Bootstrap CDK
        working-directory: ./ts-glue-cdk-example
        run: cdk bootstrap

      - name: Deploy CDK
        working-directory: ./ts-glue-cdk-example
        run: cdk deploy --require-approval never
